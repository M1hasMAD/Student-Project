<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Store</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <script th:src="@{/librerias_js/jquery.js}"></script>
    <script th:src="@{/librerias_js/mustache.js}"></script>
</head>


<body>

<header class="site-header">
    <div class="container flex flex-between">
        <a href="/" class="site-logo" aria-label="Car Store Home">
            <span class="logo-icon" aria-hidden="true">🚗</span>
            <span class="logo-text">Car Store</span>
        </a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="#" id="cars" class="nav-link">Vehicles</a>
            <a href="#" id="register" class="nav-link">Register</a>
            <a href="#" id="login" class="nav-link">Sign In</a>
            <a href="#" id="cart" class="nav-link nav-link--cart" aria-label="Shopping cart">
                <span aria-hidden="true">🛒</span>
                <span class="cart-count visually-hidden" id="cartCount">0</span>
            </a>
            <a href="#" id="orders" class="nav-link">My Orders</a>
            <a href="#" id="my_data" class="nav-link">My Account</a>
            <a href="#" id="logout" class="nav-link">Sign Out</a>
            <a href="/admin/startAdmin" class="nav-link nav-link--admin">Administration</a>
        </nav>
    </div>
</header>

<main class="container section" id="main-content">

    <section class="hero-section" aria-labelledby="hero-title">
        <div class="hero-content">
            <h1 id="hero-title" class="section-title">Find Your Next Car</h1>
            <p class="section-subtitle">Browse our collection of quality vehicles. Filter by category, brand, or price range.</p>
        </div>
    </section>

    <div id="contenedor" class="content-area"></div>

</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<script>
    // Template storage
    let templateHome;
    let templateCars;
    let templateCarDetails;
    let templateCart;

    // Load Mustache templates
    $.get("plantillas_html/home.html")
        .done(function (response) {
            templateHome = response;
        });

    $.get("plantillas_html/car_list.html")
        .done(function (response) {
            templateCars = response;
        });


    $.get("plantillas_html/car_details.html")
        .done(function (response) {
            templateCarDetails = response;
        });

    $.get("plantillas_html/cart.html")
        .done(function(response) {
            templateCart = response;
        });

    function showHome() {
        $("#contenedor").html(templateHome);
    }

    function showCars() {
        $.getJSON("restCars/list")
            .done(function (json) {
                console.log(json);
                const html = Mustache.render(templateCars, json);
                $("#contenedor").html(html);
            });
    }


    function showDetails(id) {
        $.getJSON(
            "restCars/get-car",
            {
                id: id
            }
        )
        .done(function (json) {
            console.log(json);
            const html = Mustache.render(templateCarDetails, json);
            $("#contenedor").html(html);
        });
    }


    /*
     * Navigation
     */

    $("#cars").click(function (event) {
        event.preventDefault();
        showCars();
    });


    $("#register").click(function (event) {
        event.preventDefault();
        window.location.href = "/register";
    });

    $("#login").click(function (event) {
        event.preventDefault();
        showLogin();
    });

    $("#cart").click(function(event) {
        event.preventDefault();
        showCart();
    });


    $("#orders").click(function (event) {
        event.preventDefault();
        alert("Orders functionality is not available yet.");
    });


    $("#logout").click(function (event) {
        event.preventDefault();
        alert("Logout functionality is not available yet.");
    });

    // Load cars on initial page load
    showCars();


function showCart() {
    $.getJSON("/restCart/getProducts")
        .done(function(cart) {
            if (!templateCart) {
                $("#contenedor").html(
                    "<p>Loading shopping cart...</p>"
                );
                return;
            }

            $("#contenedor").html(
                Mustache.render(templateCart, cart)
            );
        })
        .fail(function() {
            $("#contenedor").html(
                "<p>Could not load the shopping cart.</p>"
            );
        });
}

function addToCart(id, quantity) {
    const amount = Number(quantity);

    if (!Number.isInteger(amount) || amount < 1) {
        alert("Quantity must be at least 1.");
        return;
    }

    $.ajax({
        url: "/restCart/addProduct",
        method: "POST",
        data: {
            id: id,
            quantity: amount
        }
    }).done(function(response) {
        alert(response);
        updateCartCount();
    }).fail(function(xhr) {
        console.error("Add to cart failed:", xhr.status, xhr.responseText);
        alert("Could not add the product to the cart. HTTP " + xhr.status);
    });
}

function updateCartQuantity(id) {
    const input = document.getElementById("cartQuantity-" + id);
    const quantity = Number(input.value);

    if (!Number.isInteger(quantity) || quantity < 1) {
        alert("Quantity must be at least 1.");
        return;
    }

    $.get("/restCart/updateQuantity", {
        id: id,
        quantity: quantity
    }).done(function() {
        showCart();
    }).fail(function() {
        alert("Could not update the quantity.");
    });
}

function removeFromCart(id) {
    $.get("/restCart/removeProduct", {
        id: id
    }).done(function() {
        showCart();
    }).fail(function() {
        alert("Could not remove the product.");
    });
}


function showLogin() {
    const html = `
        <section class="card" style="max-width: 420px; margin: 0 auto;">
            <div class="card-header text-center">
                <h2>Sign In</h2>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="form-field">
                        <label for="loginEmail">Email:</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-field">
                        <label for="loginPass">Password:</label>
                        <input
                            type="password"
                            id="loginPass"
                            name="pass"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
                    <p id="loginMessage" class="text-center text-muted" style="margin-top: 12px; font-size: 13px;"></p>
                </form>
            </div>
        </section>
    `;

    $("#contenedor").html(html);
}

$(document).on("submit", "#loginForm", function (event) {
    event.preventDefault();

    $.ajax({
        url: "/restUsuarios/identificarUsuario",
        method: "POST",
        data: {
            email: $("#loginEmail").val(),
            pass: $("#loginPass").val()
        }
    }).done(function (response) {
        if (response.startsWith("Login successful.")) {
            $("#loginMessage").text(response).removeClass("text-muted").addClass("text-success");
            showCars();
        } else {
            $("#loginMessage").text(response).removeClass("text-muted").addClass("text-error");
        }
    }).fail(function () {
        $("#loginMessage").text("Could not sign in.").removeClass("text-muted").addClass("text-error");
    });
});

    $("#my_data").click(function (event) {
    event.preventDefault();

    $.getJSON("/restUsuarios/currentUser")
        .done(function (user) {
            if (!user.authenticated) {
                showLogin();
                return;
            }

            const html = `
                <section class="card" style="max-width: 500px; margin: 0 auto;">
                    <div class="card-header">
                        <h2>My Account</h2>
                    </div>
                    <div class="card-body">
                        <dl class="summary-list">
                            <dt>Name</dt>
                            <dd>${user.firstName} ${user.lastName}</dd>

                            <dt>Email</dt>
                            <dd>${user.email}</dd>

                            <dt>Phone</dt>
                            <dd>${user.phone}</dd>
                        </dl>
                    </div>
                </section>
            `;

            $("#contenedor").html(html);
        })
        .fail(function () {
            $("#contenedor").html(
                "<p>Could not load account information.</p>"
            );
        });
});

function showCheckout() {
    window.location.href = "/checkout/step1";
}

function updateCartCount() {
    $.getJSON("/restCart/getProducts")
        .done(function(cart) {
            const count = cart.totalQuantity || 0;
            $('#cartCount').text(count).removeClass('visually-hidden');
        });
}

// Update cart count on page load
$(document).ready(function() {
    updateCartCount();
});

</script>

</body>
</html>
