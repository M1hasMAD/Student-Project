<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{app.name}">Car Store</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <script th:src="@{/librerias_js/jquery.js}"></script>
    <script th:src="@{/librerias_js/mustache.js}"></script>
    <!-- js-cookie from CDN for cookie management (learning purposes - in real apps, use secure server-side sessions) -->
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <!-- i18n messages for JavaScript templates -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.messages = {
            login: {
                title: [[#{login.title}]],
                email: [[#{login.email}]],
                password: [[#{login.password}]],
                submit: [[#{login.submit}]],
                messageSuccess: [[#{login.message.success}]],
                messageError: [[#{login.message.error}]]
            },
            account: {
                title: [[#{account.title}]],
                name: [[#{account.name}]],
                email: [[#{account.email}]],
                phone: [[#{account.phone}]]
            },
            cart: {
                empty: [[#{cart.empty}]],
                continueShopping: [[#{cart.continue_shopping}]],
                totalQuantity: [[#{cart.total_quantity}]],
                total: [[#{cart.total}]],
                update: [[#{cart.update}]],
                remove: [[#{cart.remove}]],
                proceedCheckout: [[#{cart.proceed_checkout}]],
                price: [[#{cart.price}]],
                subtotal: [[#{cart.subtotal}]],
                quantity: [[#{cart.quantity}]]
            },
            home: {
                welcome: [[#{home.welcome}]],
                subtitle: [[#{home.subtitle}]],
                browseVehicles: [[#{home.browse_vehicles}]],
                selectVehicles: [[#{home.select_vehicles}]]
            },
            car: {
                brand: [[#{car.brand}]],
                category: [[#{car.category}]],
                price: [[#{car.price}]],
                viewDetails: [[#{car.view_details}]],
                quantity: [[#{car.quantity}]],
                addToCart: [[#{car.add_to_cart}]],
                backToListings: [[#{car.back_to_listings}]]
            },
            pagination: {
                showing: [[#{pagination.showing}]],
                of: [[#{pagination.of}]],
                results: [[#{pagination.results}]],
                previous: [[#{pagination.previous}]],
                next: [[#{pagination.next}]],
                first: [[#{pagination.first}]],
                last: [[#{pagination.last}]],
                page: [[#{pagination.page}]]
            },
            search: {
                placeholder: [[#{search.placeholder}]],
                button: [[#{search.button}]],
                clear: [[#{search.clear}]],
                per_page: [[#{search.per_page}]]
            }
        };
        /*]]>*/
    </script>
</head>


<body>

<header class="site-header">
    <div class="container flex flex-between">
        <a href="/" class="site-logo" aria-label="Car Store Home">
            <span class="logo-icon" aria-hidden="true">🚗</span>
            <span class="logo-text" th:text="#{app.name}">Car Store</span>
        </a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="#" id="cars" class="nav-link" th:text="#{nav.vehicles}">Vehicles</a>
            <a href="#" id="register" class="nav-link" th:text="#{nav.register}">Register</a>
            <a href="#" id="login" class="nav-link" th:text="#{nav.login}">Sign In</a>
            <a href="#" id="cart" class="nav-link nav-link--cart" aria-label="Shopping cart">
                <span aria-hidden="true">🛒</span>
                <span class="cart-count visually-hidden" id="cartCount">0</span>
            </a>
            <a href="#" id="orders" class="nav-link" th:text="#{nav.orders}">My Orders</a>
            <a href="#" id="my_data" class="nav-link" th:text="#{nav.account}">My Account</a>
            <a href="#" id="logout" class="nav-link" th:text="#{nav.logout}">Sign Out</a>
            <a href="/admin/startAdmin" id="admin-link" class="nav-link nav-link--admin" th:text="#{nav.admin}" style="display: none;">Administration</a>
        </nav>

        <!-- Language Switcher -->
        <div class="language-switcher" th:fragment="language-switcher">
            <span class="language-label" th:text="#{language}">Language</span>
            <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
                <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{language.en}">English</option>
                <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{language.es}">Español</option>
                <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{language.ru}">Русский</option>
            </select>
        </div>
    </div>
</header>

<main class="container section" id="main-content">

    <section class="hero-section" aria-labelledby="hero-title">
        <div class="hero-content">
            <h1 id="hero-title" class="section-title" th:text="#{hero.title}">Find Your Next Car</h1>
            <p class="section-subtitle" th:text="#{hero.subtitle}">Browse our collection of quality vehicles. Filter by category, brand, or price range.</p>
        </div>
    </section>

    <!-- Search and Filters for car listing -->
    <div id="cars-toolbar" class="cars-toolbar" style="display: none; margin-bottom: 24px;">
        <div class="card" style="padding: 16px;">
            <form id="searchForm" class="flex flex-wrap gap-md items-end" onsubmit="event.preventDefault(); currentPage = 0; showCars();">
                <div class="form-field" style="flex: 1; min-width: 250px;">
                    <label for="searchInput" class="form-label" th:text="#{search.placeholder}">Search cars...</label>
                    <input type="text"
                           id="searchInput"
                           name="search"
                           class="form-input"
                           th:placeholder="#{search.placeholder}">
                </div>
                <div class="form-field">
                    <label for="pageSizeSelect" class="form-label" th:text="#{search.per_page}">Per page</label>
                    <select id="pageSizeSelect" name="size" class="form-select" onchange="currentPage = 0; showCars();">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{search.button}">Search</button>
                <button type="button" class="btn btn-secondary" onclick="clearSearch()" th:text="#{search.clear}">Clear</button>
            </form>
        </div>
    </div>

    <div id="contenedor" class="content-area"></div>

    <!-- Pagination for car listing -->
    <div id="cars-pagination" class="pagination-container" style="display: none; margin-top: 24px;">
        <nav aria-label="Pagination" class="flex flex-center gap-sm flex-wrap" id="paginationNav">
            <!-- Pagination will be rendered here by JavaScript -->
        </nav>
    </div>

</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p th:text="#{footer.copyright}">&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<script>
    // State for pagination
    let currentPage = 0;
    let currentPageSize = 10;
    let currentSearch = '';
    let totalPages = 0;
    let totalElements = 0;

    // Template storage
    let templateHome;
    let templateCars;
    let templateCarDetails;
    let templateCart;
    let templateOrders;

    // Load Mustache templates
    $.get("plantillas_html/home.html")
        .done(function (response) {
            templateHome = response;
        });

    $.get("plantillas_html/car_list.html")
        .done(function (response) {
            templateCars = response;
        });


    $.get("plantillas_html/car_details.html")
        .done(function (response) {
            templateCarDetails = response;
        });

    $.get("plantillas_html/cart.html")
        .done(function(response) {
            templateCart = response;
        });

    $.get("plantillas_html/orders.html")
        .done(function(response) {
            templateOrders = response;
        });

    function showHome() {
        $("#contenedor").html(templateHome);
        $("#cars-toolbar").hide();
        $("#cars-pagination").hide();
    }

    function showCars() {
        const search = $("#searchInput").val().trim();
        const size = $("#pageSizeSelect").val();

        currentSearch = search;
        currentPageSize = parseInt(size);

        $("#cars-toolbar").show();

        $.getJSON("/api/cars/list", {
            page: currentPage,
            size: currentPageSize,
            search: currentSearch
        })
            .done(function (response) {
                console.log(response);

                // Render cars
                const html = Mustache.render(templateCars, response);
                $("#contenedor").html(html);

                // Update pagination state
                totalPages = response.totalPages || 0;
                totalElements = response.totalElements || 0;
                currentPage = response.currentPage || 0;

                // Render pagination
                renderPagination(response);

                // Show/hide pagination
                if (totalPages > 1) {
                    $("#cars-pagination").show();
                } else {
                    $("#cars-pagination").hide();
                }
            });
    }

    function renderPagination(response) {
        const currentPage = response.currentPage || 0;
        const totalPages = response.totalPages || 0;
        const totalElements = response.totalElements || 0;
        const pageSize = response.pageSize || 12;
        const search = response.search || '';

        if (totalPages <= 1) {
            $("#paginationNav").empty();
            return;
        }

        const start = currentPage * pageSize + 1;
        const end = Math.min((currentPage + 1) * pageSize, totalElements);

        let html = '';

        // Showing X-Y of Z results
        html += `<span class="pagination-info">${window.messages.pagination?.showing || 'Showing'} ${start} - ${end} ${window.messages.pagination?.of || 'of'} ${totalElements} ${window.messages.pagination?.results || 'results'}</span>`;

        // First page
        if (currentPage > 0) {
            html += `<button class="btn btn-secondary btn-sm" onclick="goToPage(0)">${window.messages.pagination?.first || '&laquo; First'}</button>`;
            html += `<button class="btn btn-secondary btn-sm" onclick="goToPage(${currentPage - 1})">${window.messages.pagination?.previous || '&lsaquo; Previous'}</button>`;
        }

        // Page numbers
        const startPage = Math.max(0, currentPage - 2);
        const endPage = Math.min(totalPages - 1, currentPage + 2);

        html += '<span class="pagination-pages flex gap-xs">';
        for (let i = startPage; i <= endPage; i++) {
            if (i === currentPage) {
                html += `<span class="pagination-page current">${i + 1}</span>`;
            } else {
                html += `<button class="pagination-page" onclick="goToPage(${i})">${i + 1}</button>`;
            }
        }
        html += '</span>';

        // Last page
        if (currentPage < totalPages - 1) {
            html += `<button class="btn btn-secondary btn-sm" onclick="goToPage(${currentPage + 1})">${window.messages.pagination?.next || 'Next &rsaquo;'}</button>`;
            html += `<button class="btn btn-secondary btn-sm" onclick="goToPage(${totalPages - 1})">${window.messages.pagination?.last || 'Last &raquo;'}</button>`;
        }

        $("#paginationNav").html(html);
    }

    function goToPage(page) {
        currentPage = page;
        showCars();
        // Scroll to top of car listing
        document.getElementById('contenedor').scrollIntoView({ behavior: 'smooth' });
    }

    function clearSearch() {
        $("#searchInput").val('');
        currentSearch = '';
        currentPage = 0;
        showCars();
    }


    function showDetails(id) {
        $.getJSON(
            "/api/cars/get-car",
            {
                id: id
            }
        )
        .done(function (json) {
            console.log(json);
            const html = Mustache.render(templateCarDetails, json);
            $("#contenedor").html(html);
            $("#cars-toolbar").hide();
            $("#cars-pagination").hide();
        });
    }


    /*
     * Navigation
     */

    $("#cars").click(function (event) {
        event.preventDefault();
        currentPage = 0;
        showCars();
    });


    $("#register").click(function (event) {
        event.preventDefault();
        window.location.href = "/register";
    });

    $("#login").click(function (event) {
        event.preventDefault();
        showLogin();
    });

    $("#cart").click(function(event) {
        event.preventDefault();
        showCart();
    });


    $("#orders").click(function (event) {
        event.preventDefault();
        showOrders();
    });


    $("#my_data").click(function (event) {
        event.preventDefault();
        showAccount();
    });

    $("#logout").click(function (event) {
        event.preventDefault();
        doLogout();
    });

    /*
     * Cookie-based Authentication Functions
     * Learning exercise: In real apps, use secure server-side sessions with HttpOnly cookies
     * Never store passwords in cookies!
     */

    // Cookie name for user identification
    const USER_COOKIE_NAME = 'shop_user_id';
    const USER_COOKIE_EXPIRY = 7; // days

    // Check if user cookie exists
    function getUserCookie() {
        return Cookies.get(USER_COOKIE_NAME);
    }

    // Set user cookie (store user ID or email, NOT password)
    function setUserCookie(userId) {
        Cookies.set(USER_COOKIE_NAME, userId, { expires: USER_COOKIE_EXPIRY, path: '/' });
    }

    // Clear user cookie
    function clearUserCookie() {
        Cookies.remove(USER_COOKIE_NAME, { path: '/' });
    }

    // Check if user appears to be logged in (has cookie)
    function isUserLoggedIn() {
        return getUserCookie() !== undefined;
    }

    // Update UI based on authentication state
    async function updateAuthUI() {
        const loggedIn = isUserLoggedIn();
        const userEmail = getUserCookie();

        if (loggedIn) {
            // User is logged in - fetch user details including role
            try {
                const response = await fetch('/api/users/current');
                const user = await response.json();

                if (user.authenticated) {
                    // User is logged in - show logout, account, hide login/register
                    $("#login").hide();
                    $("#register").hide();
                    $("#logout").show();
                    $("#my_data").show();
                    $("#orders").show();
                    // Update logout link to show user email
                    const logoutText = (window.messages.nav?.logout || 'Sign Out') + ' (' + userEmail + ')';
                    $("#logout").text(logoutText);

                    // Show admin link only for ADMIN role
                    if (user.role === 'ADMIN') {
                        $("#admin-link").show();
                    } else {
                        $("#admin-link").hide();
                    }
                } else {
                    // Session expired but cookie exists
                    clearUserCookie();
                    updateAuthUI();
                    return;
                }
            } catch (error) {
                console.error('Failed to fetch user:', error);
                clearUserCookie();
                updateAuthUI();
                return;
            }
        } else {
            // User is not logged in - show login/register, hide logout/account
            $("#login").show();
            $("#register").show();
            $("#logout").hide();
            $("#my_data").hide();
            $("#orders").hide();
            $("#admin-link").hide();
        }
    }

    // Perform logout - call API and clear cookie
    function doLogout() {
        $.ajax({
            url: "/api/users/logout",
            method: "POST"
        }).done(function(response) {
            clearUserCookie();
            updateAuthUI();
            showCars(); // Return to car listing
            alert("Logout successful.");
        }).fail(function() {
            // Even if API fails, clear local cookie
            clearUserCookie();
            updateAuthUI();
            showCars();
            alert("Logged out locally.");
        });
    }

    // Show account page (requires authentication)
    function showAccount() {
        if (!isUserLoggedIn()) {
            showLogin();
            return;
        }

        $.getJSON("/api/users/current")
            .done(function (user) {
                if (!user.authenticated) {
                    // Session expired but cookie exists - clear cookie and show login
                    clearUserCookie();
                    updateAuthUI();
                    showLogin();
                    return;
                }

                const msg = window.messages.account;
                const html = `
                    <section class="card" style="max-width: 500px; margin: 0 auto;">
                        <div class="card-header">
                            <h2>${msg.title}</h2>
                        </div>
                        <div class="card-body">
                            <dl class="summary-list">
                                <dt>${msg.name}</dt>
                                <dd>${user.firstName} ${user.lastName}</dd>

                                <dt>${msg.email}</dt>
                                <dd>${user.email}</dd>

                                <dt>${msg.phone}</dt>
                                <dd>${user.phone}</dd>
                            </dl>
                        </div>
                    </section>
                `;

                $("#contenedor").html(html);
                $("#cars-toolbar").hide();
                $("#cars-pagination").hide();
            })
            .fail(function () {
                $("#contenedor").html(
                    "<p>Could not load account information.</p>"
                );
            });
    }

    // Show user orders page (requires authentication)
    function showOrders() {
        if (!isUserLoggedIn()) {
            showLogin();
            return;
        }

        $.getJSON("/api/users/orders")
            .done(function (response) {
                if (!response.authenticated) {
                    clearUserCookie();
                    updateAuthUI();
                    showLogin();
                    return;
                }

                const html = Mustache.render(templateOrders, response);
                $("#contenedor").html(html);
                $("#cars-toolbar").hide();
                $("#cars-pagination").hide();
            })
            .fail(function () {
                $("#contenedor").html(
                    "<p>Could not load orders.</p>"
                );
            });
    }

    // Load cars on initial page load
    showCars();

    // Initialize auth UI on page load
    $(document).ready(function() {
        updateAuthUI();
        updateCartCount();
    });


function showCart() {
    $.getJSON("/api/cart/getProducts")
        .done(function(cart) {
            if (!templateCart) {
                $("#contenedor").html(
                    "<p>Loading shopping cart...</p>"
                );
                return;
            }

            $("#contenedor").html(
                Mustache.render(templateCart, cart)
            );
            $("#cars-toolbar").hide();
            $("#cars-pagination").hide();
        })
        .fail(function() {
            $("#contenedor").html(
                "<p>Could not load the shopping cart.</p>"
            );
        });
}

function addToCart(id, quantity) {
    const amount = Number(quantity);

    if (!Number.isInteger(amount) || amount < 1) {
        alert("Quantity must be at least 1.");
        return;
    }

    $.ajax({
        url: "/api/cart/addProduct",
        method: "POST",
        data: {
            id: id,
            quantity: amount
        }
    }).done(function(response) {
        alert(response);
        updateCartCount();
    }).fail(function(xhr) {
        console.error("Add to cart failed:", xhr.status, xhr.responseText);
        alert("Could not add the product to the cart. HTTP " + xhr.status);
    });
}

function updateCartQuantity(id) {
    const input = document.getElementById("cartQuantity-" + id);
    const quantity = Number(input.value);

    if (!Number.isInteger(quantity) || quantity < 1) {
        alert("Quantity must be at least 1.");
        return;
    }

    $.post("/api/cart/updateQuantity", {
        id: id,
        quantity: quantity
    }).done(function(cart) {
        if (cart.error) {
            alert(cart.error);
            // Reset input to previous value by reloading cart
            showCart();
        } else {
            // Update UI without full reload
            updateCartUI(cart);
        }
    }).fail(function() {
        alert("Could not update the quantity.");
        showCart();
    });
}

function changeQuantity(id, delta) {
    const input = document.getElementById("cartQuantity-" + id);
    let quantity = Number(input.value) + delta;
    if (quantity < 1) quantity = 1;
    input.value = quantity;
    updateCartQuantity(id);
}

// Debounced auto-update on input change
let quantityUpdateTimer = null;
function onQuantityInputChange(id) {
    clearTimeout(quantityUpdateTimer);
    quantityUpdateTimer = setTimeout(() => {
        updateCartQuantity(id);
    }, 500);
}

function removeFromCart(id) {
    $.post("/api/cart/removeProduct", {
        id: id
    }).done(function(cart) {
        if (cart.error) {
            alert(cart.error);
        } else {
            updateCartUI(cart);
        }
    }).fail(function() {
        alert("Could not remove the product.");
        showCart();
    });
}

function updateCartUI(cart) {
    // Update totals
    $("#totalQuantity").text(cart.totalQuantity);
    $("#cartTotal").text("€" + cart.total.toFixed(2));

    // Update each product's subtotal and quantity
    if (cart.products && Array.isArray(cart.products)) {
        cart.products.forEach(product => {
            const itemEl = $(`.cart-item[data-car-id="${product.id}"]`);
            if (itemEl.length) {
                itemEl.find(".subtotal-value").text("€" + product.subtotal.toFixed(2));
                itemEl.find(".qty-input").val(product.quantity);
            }
        });
    }

    // Update cart count in header
    updateCartCount();

    // If cart is now empty, reload to show empty state
    if (cart.empty) {
        showCart();
    }
}

// Event delegation for cart quantity controls
$(document).on("click", ".qty-btn", function() {
    const $btn = $(this);
    const carId = $btn.data("car-id");
    const action = $btn.data("action");
    const delta = action === "increase" ? 1 : -1;
    changeQuantity(carId, delta);
});

$(document).on("change", ".qty-input", function() {
    const carId = $(this).data("car-id");
    onQuantityInputChange(carId);
});


function showLogin() {
    const msg = window.messages.login;
    const html = `
        <section class="card" style="max-width: 420px; margin: 0 auto;">
            <div class="card-header text-center">
                <h2>${msg.title}</h2>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="form-field">
                        <label for="loginEmail">${msg.email}:</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-field">
                        <label for="loginPass">${msg.password}:</label>
                        <input
                            type="password"
                            id="loginPass"
                            name="pass"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">${msg.submit}</button>
                    <p id="loginMessage" class="text-center text-muted" style="margin-top: 12px; font-size: 13px;"></p>
                </form>
            </div>
        </section>
    `;

    $("#contenedor").html(html);
    $("#cars-toolbar").hide();
    $("#cars-pagination").hide();
}

$(document).on("submit", "#loginForm", function (event) {
    event.preventDefault();
    const msg = window.messages.login;
    const email = $("#loginEmail").val();

    $.ajax({
        url: "/api/users/login",
        method: "POST",
        data: {
            email: email,
            pass: $("#loginPass").val()
        }
    }).done(function (response) {
        if (response.startsWith("Login successful.")) {
            // Set cookie with user email (learning: never store password in cookie!)
            setUserCookie(email);
            updateAuthUI();
            $("#loginMessage").text(msg.messageSuccess).removeClass("text-muted").addClass("text-success");
            showCars();
        } else {
            $("#loginMessage").text(response).removeClass("text-muted").addClass("text-error");
        }
    }).fail(function () {
        $("#loginMessage").text(msg.messageError).removeClass("text-muted").addClass("text-error");
    });
});

function showCheckout() {
    window.location.href = "/checkout/step1";
}

function updateCartCount() {
    $.getJSON("/restCart/getProducts")
        .done(function(cart) {
            const count = cart.totalQuantity || 0;
            $('#cartCount').text(count).removeClass('visually-hidden');
        });
}

// Update cart count and auth UI on page load
$(document).ready(function() {
    updateAuthUI();
    updateCartCount();
});

// Language switcher function
function changeLanguage(lang) {
    const currentUrl = window.location.href;
    const url = new URL(currentUrl);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
}

// i18n translation function for Mustache-rendered templates
function translateRenderedContent(container) {
    if (!container) container = document.body;
    if (!window.messages) return;

    const allMessages = {
        ...window.messages.car,
        ...window.messages.cart,
        ...window.messages.home,
        ...window.messages.checkout,
        ...window.messages.register,
        ...window.messages.pagination,
        ...window.messages.search
    };

    // Helper to convert snake_case to camelCase
    function toCamelCase(str) {
        return str.replace(/_([a-z])/g, (_, letter) => letter.toUpperCase());
    }

    // Helper to strip prefix (e.g., "car.", "cart.", "home.") from key
    function stripPrefix(key) {
        return key.replace(/^(car|cart|home|checkout|register|pagination|search)\./, '');
    }

    container.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        // Try exact key first, then camelCase version, then stripped prefix version
        let translation = allMessages[key] || allMessages[toCamelCase(key)];
        if (!translation) {
            const strippedKey = stripPrefix(key);
            translation = allMessages[strippedKey] || allMessages[toCamelCase(strippedKey)];
        }
        if (translation) {
            if (el.tagName === 'INPUT' && (el.type === 'submit' || el.type === 'button')) {
                el.value = translation;
            } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = translation;
            } else {
                // Preserve child elements (like <span> in buttons)
                const childNodes = Array.from(el.childNodes);
                const textNodes = childNodes.filter(n => n.nodeType === Node.TEXT_NODE);
                if (textNodes.length > 0) {
                    textNodes[0].textContent = translation;
                } else {
                    el.textContent = translation;
                }
            }
        }
    });
}

// Wrapper functions that translate after rendering
const originalShowCars = showCars;
showCars = function() {
    originalShowCars();
    // Translate after a brief delay to allow Mustache rendering
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
    setTimeout(() => translateRenderedContent(document.getElementById('cars-toolbar')), 0);
    setTimeout(() => translateRenderedContent(document.getElementById('cars-pagination')), 0);
};

const originalShowDetails = showDetails;
showDetails = function(id) {
    originalShowDetails(id);
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

const originalShowCart = showCart;
showCart = function() {
    originalShowCart();
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

const originalShowHome = showHome;
showHome = function() {
    originalShowHome();
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

</script>
