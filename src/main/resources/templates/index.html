<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{app.name}">Car Store</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <script th:src="@{/librerias_js/jquery.js}"></script>
    <script th:src="@{/librerias_js/mustache.js}"></script>
    <!-- i18n messages for JavaScript templates -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.messages = {
            login: {
                title: [[#{login.title}]],
                email: [[#{login.email}]],
                password: [[#{login.password}]],
                submit: [[#{login.submit}]],
                messageSuccess: [[#{login.message.success}]],
                messageError: [[#{login.message.error}]]
            },
            account: {
                title: [[#{account.title}]],
                name: [[#{account.name}]],
                email: [[#{account.email}]],
                phone: [[#{account.phone}]]
            },
            cart: {
                empty: [[#{cart.empty}]],
                continueShopping: [[#{cart.continue_shopping}]],
                totalQuantity: [[#{cart.total_quantity}]],
                total: [[#{cart.total}]],
                update: [[#{cart.update}]],
                remove: [[#{cart.remove}]],
                proceedCheckout: [[#{cart.proceed_checkout}]],
                price: [[#{cart.price}]],
                subtotal: [[#{cart.subtotal}]],
                quantity: [[#{cart.quantity}]]
            },
            home: {
                welcome: [[#{home.welcome}]],
                subtitle: [[#{home.subtitle}]],
                browseVehicles: [[#{home.browse_vehicles}]],
                selectVehicles: [[#{home.select_vehicles}]]
            },
            car: {
                brand: [[#{car.brand}]],
                category: [[#{car.category}]],
                price: [[#{car.price}]],
                viewDetails: [[#{car.view_details}]],
                quantity: [[#{car.quantity}]],
                addToCart: [[#{car.add_to_cart}]],
                backToListings: [[#{car.back_to_listings}]]
            }
        };
        /*]]>*/
    </script>
</head>


<body>

<header class="site-header">
    <div class="container flex flex-between">
        <a href="/" class="site-logo" aria-label="Car Store Home">
            <span class="logo-icon" aria-hidden="true">🚗</span>
            <span class="logo-text" th:text="#{app.name}">Car Store</span>
        </a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="#" id="cars" class="nav-link" th:text="#{nav.vehicles}">Vehicles</a>
            <a href="#" id="register" class="nav-link" th:text="#{nav.register}">Register</a>
            <a href="#" id="login" class="nav-link" th:text="#{nav.login}">Sign In</a>
            <a href="#" id="cart" class="nav-link nav-link--cart" aria-label="Shopping cart">
                <span aria-hidden="true">🛒</span>
                <span class="cart-count visually-hidden" id="cartCount">0</span>
            </a>
            <a href="#" id="orders" class="nav-link" th:text="#{nav.orders}">My Orders</a>
            <a href="#" id="my_data" class="nav-link" th:text="#{nav.account}">My Account</a>
            <a href="#" id="logout" class="nav-link" th:text="#{nav.logout}">Sign Out</a>
            <a href="/admin/startAdmin" class="nav-link nav-link--admin" th:text="#{nav.admin}">Administration</a>
        </nav>

        <!-- Language Switcher -->
        <div class="language-switcher" th:fragment="language-switcher">
            <span class="language-label" th:text="#{language}">Language</span>
            <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
                <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{language.en}">English</option>
                <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{language.es}">Español</option>
                <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{language.ru}">Русский</option>
            </select>
        </div>
    </div>
</header>

<main class="container section" id="main-content">

    <section class="hero-section" aria-labelledby="hero-title">
        <div class="hero-content">
            <h1 id="hero-title" class="section-title" th:text="#{hero.title}">Find Your Next Car</h1>
            <p class="section-subtitle" th:text="#{hero.subtitle}">Browse our collection of quality vehicles. Filter by category, brand, or price range.</p>
        </div>
    </section>

    <div id="contenedor" class="content-area"></div>

</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p th:text="#{footer.copyright}">&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<script>
    // Template storage
    let templateHome;
    let templateCars;
    let templateCarDetails;
    let templateCart;

    // Load Mustache templates
    $.get("plantillas_html/home.html")
        .done(function (response) {
            templateHome = response;
        });

    $.get("plantillas_html/car_list.html")
        .done(function (response) {
            templateCars = response;
        });


    $.get("plantillas_html/car_details.html")
        .done(function (response) {
            templateCarDetails = response;
        });

    $.get("plantillas_html/cart.html")
        .done(function(response) {
            templateCart = response;
        });

    function showHome() {
        $("#contenedor").html(templateHome);
    }

    function showCars() {
        $.getJSON("/api/cars/list")
            .done(function (json) {
                console.log(json);
                const html = Mustache.render(templateCars, json);
                $("#contenedor").html(html);
            });
    }


    function showDetails(id) {
        $.getJSON(
            "/api/cars/get-car",
            {
                id: id
            }
        )
        .done(function (json) {
            console.log(json);
            const html = Mustache.render(templateCarDetails, json);
            $("#contenedor").html(html);
        });
    }


    /*
     * Navigation
     */

    $("#cars").click(function (event) {
        event.preventDefault();
        showCars();
    });


    $("#register").click(function (event) {
        event.preventDefault();
        window.location.href = "/register";
    });

    $("#login").click(function (event) {
        event.preventDefault();
        showLogin();
    });

    $("#cart").click(function(event) {
        event.preventDefault();
        showCart();
    });


    $("#orders").click(function (event) {
        event.preventDefault();
        alert("Orders functionality is not available yet.");
    });


    $("#logout").click(function (event) {
        event.preventDefault();
        alert("Logout functionality is not available yet.");
    });

    // Load cars on initial page load
    showCars();


function showCart() {
    $.getJSON("/api/cart/getProducts")
        .done(function(cart) {
            if (!templateCart) {
                $("#contenedor").html(
                    "<p>Loading shopping cart...</p>"
                );
                return;
            }

            $("#contenedor").html(
                Mustache.render(templateCart, cart)
            );
        })
        .fail(function() {
            $("#contenedor").html(
                "<p>Could not load the shopping cart.</p>"
            );
        });
}

function addToCart(id, quantity) {
    const amount = Number(quantity);

    if (!Number.isInteger(amount) || amount < 1) {
        alert("Quantity must be at least 1.");
        return;
    }

    $.ajax({
        url: "/api/cart/addProduct",
        method: "POST",
        data: {
            id: id,
            quantity: amount
        }
    }).done(function(response) {
        alert(response);
        updateCartCount();
    }).fail(function(xhr) {
        console.error("Add to cart failed:", xhr.status, xhr.responseText);
        alert("Could not add the product to the cart. HTTP " + xhr.status);
    });
}

function updateCartQuantity(id) {
    const input = document.getElementById("cartQuantity-" + id);
    const quantity = Number(input.value);

    if (!Number.isInteger(quantity) || quantity < 1) {
        alert("Quantity must be at least 1.");
        return;
    }

    $.post("/api/cart/updateQuantity", {
        id: id,
        quantity: quantity
    }).done(function() {
        showCart();
    }).fail(function() {
        alert("Could not update the quantity.");
    });
}

function removeFromCart(id) {
    $.post("/api/cart/removeProduct", {
        id: id
    }).done(function() {
        showCart();
    }).fail(function() {
        alert("Could not remove the product.");
    });
}


function showLogin() {
    const msg = window.messages.login;
    const html = `
        <section class="card" style="max-width: 420px; margin: 0 auto;">
            <div class="card-header text-center">
                <h2>${msg.title}</h2>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="form-field">
                        <label for="loginEmail">${msg.email}:</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-field">
                        <label for="loginPass">${msg.password}:</label>
                        <input
                            type="password"
                            id="loginPass"
                            name="pass"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">${msg.submit}</button>
                    <p id="loginMessage" class="text-center text-muted" style="margin-top: 12px; font-size: 13px;"></p>
                </form>
            </div>
        </section>
    `;

    $("#contenedor").html(html);
}

$(document).on("submit", "#loginForm", function (event) {
    event.preventDefault();
    const msg = window.messages.login;

    $.ajax({
        url: "/api/users/login",
        method: "POST",
        data: {
            email: $("#loginEmail").val(),
            pass: $("#loginPass").val()
        }
    }).done(function (response) {
        if (response.startsWith("Login successful.")) {
            $("#loginMessage").text(msg.messageSuccess).removeClass("text-muted").addClass("text-success");
            showCars();
        } else {
            $("#loginMessage").text(response).removeClass("text-muted").addClass("text-error");
        }
    }).fail(function () {
        $("#loginMessage").text(msg.messageError).removeClass("text-muted").addClass("text-error");
    });
});

    $("#my_data").click(function (event) {
    event.preventDefault();

    $.getJSON("/api/users/current")
        .done(function (user) {
            if (!user.authenticated) {
                showLogin();
                return;
            }

            const msg = window.messages.account;
            const html = `
                <section class="card" style="max-width: 500px; margin: 0 auto;">
                    <div class="card-header">
                        <h2>${msg.title}</h2>
                    </div>
                    <div class="card-body">
                        <dl class="summary-list">
                            <dt>${msg.name}</dt>
                            <dd>${user.firstName} ${user.lastName}</dd>

                            <dt>${msg.email}</dt>
                            <dd>${user.email}</dd>

                            <dt>${msg.phone}</dt>
                            <dd>${user.phone}</dd>
                        </dl>
                    </div>
                </section>
            `;

            $("#contenedor").html(html);
        })
        .fail(function () {
            $("#contenedor").html(
                "<p>Could not load account information.</p>"
            );
        });
});

function showCheckout() {
    window.location.href = "/checkout/step1";
}

function updateCartCount() {
    $.getJSON("/restCart/getProducts")
        .done(function(cart) {
            const count = cart.totalQuantity || 0;
            $('#cartCount').text(count).removeClass('visually-hidden');
        });
}

// Update cart count on page load
$(document).ready(function() {
    updateCartCount();
});

// Language switcher function
function changeLanguage(lang) {
    const currentUrl = window.location.href;
    const url = new URL(currentUrl);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
}

// i18n translation function for Mustache-rendered templates
function translateRenderedContent(container) {
    if (!container) container = document.body;
    if (!window.messages) return;

    const allMessages = {
        ...window.messages.car,
        ...window.messages.cart,
        ...window.messages.home,
        ...window.messages.checkout,
        ...window.messages.register
    };

    // Helper to convert snake_case to camelCase
    function toCamelCase(str) {
        return str.replace(/_([a-z])/g, (_, letter) => letter.toUpperCase());
    }

    // Helper to strip prefix (e.g., "car.", "cart.", "home.") from key
    function stripPrefix(key) {
        return key.replace(/^(car|cart|home|checkout|register)\./, '');
    }

    container.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        // Try exact key first, then camelCase version, then stripped prefix version
        let translation = allMessages[key] || allMessages[toCamelCase(key)];
        if (!translation) {
            const strippedKey = stripPrefix(key);
            translation = allMessages[strippedKey] || allMessages[toCamelCase(strippedKey)];
        }
        if (translation) {
            if (el.tagName === 'INPUT' && (el.type === 'submit' || el.type === 'button')) {
                el.value = translation;
            } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = translation;
            } else {
                // Preserve child elements (like <span> in buttons)
                const childNodes = Array.from(el.childNodes);
                const textNodes = childNodes.filter(n => n.nodeType === Node.TEXT_NODE);
                if (textNodes.length > 0) {
                    textNodes[0].textContent = translation;
                } else {
                    el.textContent = translation;
                }
            }
        }
    });
}

// Wrapper functions that translate after rendering
const originalShowCars = showCars;
showCars = function() {
    originalShowCars();
    // Translate after a brief delay to allow Mustache rendering
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

const originalShowDetails = showDetails;
showDetails = function(id) {
    originalShowDetails(id);
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

const originalShowCart = showCart;
showCart = function() {
    originalShowCart();
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

const originalShowHome = showHome;
showHome = function() {
    originalShowHome();
    setTimeout(() => translateRenderedContent(document.getElementById('contenedor')), 0);
};

</script>

</body>
</html>
