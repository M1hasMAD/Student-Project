<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{checkout.step1.title} + ' | ' + #{app.name}">Car Store - Shipping Details</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="site-header">
    <div class="container flex flex-between">
        <a href="/" class="site-logo" aria-label="Car Store Home">
            <span class="logo-icon" aria-hidden="true">🚗</span>
            <span class="logo-text" th:text="#{app.name}">Car Store</span>
        </a>

        <!-- Language Switcher -->
        <div class="language-switcher">
            <span class="language-label" th:text="#{language}">Language</span>
            <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
                <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{language.en}">English</option>
                <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{language.es}">Español</option>
                <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{language.ru}">Русский</option>
            </select>
        </div>

        <a href="/" class="nav-link nav-link--ghost" th:text="#{nav.back_to_store}">← Back to Store</a>
    </div>
</header>

<main class="container section">
    <div class="checkout-progress mb-lg">
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div style="text-align:center;margin-bottom:28px">
        <p class="text-muted" style="font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;" th:text="#{checkout.secure}">Secure Checkout</p>
        <h1 class="section-title" th:text="#{checkout.step1.title}">Shipping Details</h1>
        <p class="section-subtitle" th:text="#{checkout.step1.subtitle}">Tell us where to deliver your new car.</p>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h2 th:text="#{checkout.step1.delivery_info}">Delivery Information</h2>
            <p class="text-muted" th:text="#{checkout.step1.complete_fields}">Please complete all fields below.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/checkout/shipping}" method="post" class="form-field">

                <div class="form-field">
                    <label for="fullName" th:text="#{checkout.step1.full_name}">Full Name</label>
                    <input type="text" id="fullName"
                           name="fullName"
                           th:placeholder="#{checkout.step1.full_name_placeholder}"
                           placeholder="Enter your full name"
                           autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="address" th:text="#{checkout.step1.address}">Street Address</label>
                    <input type="text" id="address"
                           name="address"
                           th:placeholder="#{checkout.step1.address_placeholder}"
                           placeholder="Street, building and apartment"
                           autocomplete="street-address" required>
                </div>

                <div class="form-field">
                    <label for="province" th:text="#{checkout.step1.province}">Province</label>
                    <input type="text" id="province"
                           name="province"
                           th:placeholder="#{checkout.step1.province_placeholder}"
                           placeholder="e.g. Madrid" required>
                </div>

                <div class="form-field">
                    <label for="phone" th:text="#{checkout.step1.phone}">Phone Number</label>
                    <input type="tel" id="phone"
                           name="phone"
                           th:placeholder="#{checkout.step1.phone_placeholder}"
                           placeholder="+34 600 000 000"
                           autocomplete="tel" required>
                </div>

                <div class="form-field">
                    <label for="city" th:text="#{checkout.step1.city}">City</label>
                    <input type="text" id="city"
                           name="city"
                           th:placeholder="#{checkout.step1.city_placeholder}"
                           placeholder="Enter your city"
                           autocomplete="address-level2" required>
                </div>

                <div class="form-field">
                    <label for="postalCode" th:text="#{checkout.step1.postal_code}">Postal Code</label>
                    <input type="text" id="postalCode"
                           name="postalCode"
                           th:placeholder="#{checkout.step1.postal_code_placeholder}"
                           placeholder="e.g. 28001"
                           autocomplete="postal-code" required>
                </div>

                <div class="form-actions flex flex-between gap-md" style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--color-border);">
                    <a href="/" class="btn btn-secondary" th:text="#{nav.back_to_store}">← Back to Store</a>
                    <button type="submit" class="btn btn-primary" th:text="#{checkout.step1.continue_payment}">Continue to Payment →</button>
                </div>

            </form>
        </div>
    </div>

    <p class="text-center text-muted" style="margin-top:24px; font-size:13px;">
        🚗 <span th:text="#{app.name}">Car Store</span> · Your order, your journey.
    </p>

</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p th:text="#{footer.copyright}">&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<div th:insert="fragments/general.html :: language-script"></div>

</body>
</html>
