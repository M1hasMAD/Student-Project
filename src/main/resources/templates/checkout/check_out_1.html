<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store - Shipping Details</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="site-header">
    <div class="container flex flex-between">
        <a href="/" class="site-logo" aria-label="Car Store Home">
            <span class="logo-icon" aria-hidden="true">🚗</span>
            <span class="logo-text">Car Store</span>
        </a>
        <a href="/" class="nav-link nav-link--ghost">← Back to Store</a>
    </div>
</header>

<main class="container section">
    <div class="checkout-progress mb-lg">
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div style="text-align:center;margin-bottom:28px">
        <p class="text-muted" style="font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;">
            Secure Checkout
        </p>
        <h1 class="section-title">Shipping Details</h1>
        <p class="section-subtitle">Tell us where to deliver your new car.</p>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h2>Delivery Information</h2>
            <p class="text-muted">Please complete all fields below.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/checkout/shipping}" method="post" class="form-field">

                <div class="form-field">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"
                           name="fullName"
                           placeholder="Enter your full name"
                           autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="address">Street Address</label>
                    <input type="text" id="address"
                           name="address"
                           placeholder="Street, building and apartment"
                           autocomplete="street-address" required>
                </div>

                <div class="form-field">
                    <label for="province">Province</label>
                    <input type="text" id="province"
                           name="province"
                           placeholder="e.g. Madrid" required>
                </div>

                <div class="form-field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           name="phone"
                           placeholder="+34 600 000 000"
                           autocomplete="tel" required>
                </div>

                <div class="form-field">
                    <label for="city">City</label>
                    <input type="text" id="city"
                           name="city"
                           placeholder="Enter your city"
                           autocomplete="address-level2" required>
                </div>

                <div class="form-field">
                    <label for="postalCode">Postal Code</label>
                    <input type="text" id="postalCode"
                           name="postalCode"
                           placeholder="e.g. 28001"
                           autocomplete="postal-code" required>
                </div>

                <div class="form-actions flex flex-between gap-md" style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--color-border);">
                    <a href="/" class="btn btn-secondary">← Back to Store</a>
                    <button type="submit" class="btn btn-primary">Continue to Payment →</button>
                </div>

            </form>
        </div>
    </div>

    <p class="text-center text-muted" style="margin-top:24px; font-size:13px;">
        🚗 Car Store · Your order, your journey.
    </p>

</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
