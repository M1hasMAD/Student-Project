<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{checkout.step2.title} + ' | ' + #{app.name}">Checkout - Payment Details</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="site-header">
    <div class="container flex flex-between">
        <a href="/" class="site-logo" aria-label="Car Store Home">
            <span class="logo-icon" aria-hidden="true">🚗</span>
            <span class="logo-text" th:text="#{app.name}">Car Store</span>
        </a>

        <!-- Language Switcher -->
        <div class="language-switcher">
            <span class="language-label" th:text="#{language}">Language</span>
            <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
                <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{language.en}">English</option>
                <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{language.es}">Español</option>
                <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{language.ru}">Русский</option>
            </select>
        </div>

        <a href="/" class="nav-link nav-link--ghost" th:text="#{nav.back_to_store}">← Back to Store</a>
    </div>
</header>

<main class="container section">
    <div class="checkout-progress mb-lg">
        <span class="active"></span>
        <span class="active"></span>
        <span></span>
        <span></span>
    </div>

    <div style="text-align:center;margin-bottom:28px">
        <p class="text-muted" style="font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;" th:text="#{checkout.secure}">Secure Checkout</p>
        <h1 class="section-title" th:text="#{checkout.step2.title}">Payment Details</h1>
        <p class="section-subtitle" th:text="#{checkout.step2.subtitle}">Choose your payment card and enter your billing details.</p>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h2 th:text="#{checkout.step2.payment_info}">Payment Information</h2>
            <p class="text-muted" th:text="#{checkout.step2.complete_fields}">Please complete all fields below.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/checkout/payment}" method="post" class="form-field">

                <div class="form-field">
                    <label for="cardType" th:text="#{checkout.step2.card_type}">Card Type</label>
                    <select id="cardType" name="cardType" required>
                        <option value="" th:text="#{checkout.step2.choose_card}">Choose card type</option>
                        <option value="visa" th:text="#{checkout.step2.visa}">Visa</option>
                        <option value="master_card" th:text="#{checkout.step2.mastercard}">Mastercard</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="cardHolder" th:text="#{checkout.step2.cardholder}">Cardholder Name</label>
                    <input type="text" id="cardHolder" name="cardHolder"
                           th:placeholder="#{checkout.step2.cardholder_placeholder}"
                           placeholder="Name printed on the card" required>
                </div>

                <div class="form-field">
                    <label for="billingAddress" th:text="#{checkout.step2.billing_address}">Billing Address</label>
                    <input type="text" id="billingAddress" name="billingAddress"
                           th:placeholder="#{checkout.step2.billing_address_placeholder}"
                           placeholder="Your billing address" required>
                </div>

                <div class="form-actions flex flex-between gap-md" style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--color-border);">
                    <a th:href="@{/checkout/step1}" class="btn btn-secondary" th:text="#{checkout.back}">← Back</a>
                    <button type="submit" class="btn btn-primary" th:text="#{checkout.step2.continue_delivery}">Continue to Delivery →</button>
                </div>
            </form>
        </div>
    </div>

    <p class="text-center text-muted" style="margin-top:24px; font-size:13px;">
        🚗 <span th:text="#{app.name}">Car Store</span> · Your order, your journey.
    </p>

</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p th:text="#{footer.copyright}">&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<div th:insert="fragments/general.html :: language-script"></div>

</body>
</html>
