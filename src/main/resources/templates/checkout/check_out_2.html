
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Payment details</title>
    <link rel="stylesheet" th:href="@{/css/checkout.css}">
</head>
<body>

<header class="store-header">
    <div class="store-header-content">
        <a th:href="@{/}" class="store-logo">🚗 Car Store</a>
        <a th:href="@{/}" class="admin-link">← Back to Store</a>
    </div>
</header>

<main class="checkout-container">
    <div class="checkout-heading">
        <span class="checkout-eyebrow">SECURE CHECKOUT</span>
        <h1 class="checkout-title">Payment details</h1>
        <p class="checkout-subtitle">
            Choose your payment card and enter your billing details.
        </p>
    </div>

    <div class="checkout-progress">
        <span class="active"></span>
        <span class="active"></span>
        <span></span>
        <span></span>
    </div>

    <section class="checkout-card">
        <h2>Payment information</h2>
        <p class="section-description">
            Please complete all fields below.
        </p>

        <form th:action="@{/checkout/payment}" method="post"
              class="checkout-form">

            <div class="form-group">
                <label for="cardType">Card type</label>
                <select id="cardType" name="cardType" required>
                    <option value="">Choose card type</option>
                    <option value="visa">Visa</option>
                    <option value="master_card">Mastercard</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cardHolder">Cardholder name</label>
                <input type="text" id="cardHolder" name="cardHolder"
                       placeholder="Name printed on the card" required>
            </div>

            <div class="form-group">
                <label for="billingAddress">Billing address</label>
                <input type="text" id="billingAddress" name="billingAddress"
                       placeholder="Your billing address" required>
            </div>

            <div class="checkout-actions">
                <a th:href="@{/checkout/step1}" class="button-secondary">
                    ← Back
                </a>
                <button type="submit" class="button-primary">
                    Continue to delivery →
                </button>
            </div>
        </form>
    </section>

    <footer class="checkout-footer">
        🚗 Car Store · Your order, your journey.
    </footer>
</main>

</body>
</html>
