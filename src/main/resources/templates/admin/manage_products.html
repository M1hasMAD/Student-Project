<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Cars</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div th:insert="fragments/general.html :: menu"></div>

<main class="admin-container">

    <div class="page-header">
        <div>
            <h1>Manage Cars</h1>
            <p>View, edit and delete cars from the store.</p>
        </div>

        <a th:href="@{/admin/registerCar}"
           class="button button-primary">
            + Add New Car
        </a>
    </div>

    <div class="cars-grid">

        <div class="car-card" th:each="car : ${cars}">

            <div class="car-image-container">
                <img th:src="@{/get_image(id=${car.id})}"
                     alt="Car image"
                     class="car-image">
            </div>

            <div class="car-content">

                <h2 th:text="${car.title}">
                    Car title
                </h2>

                <div class="car-price">
                    €<span th:text="${car.price}">0</span>
                </div>

                <p class="car-brand">
                    <strong>Brand:</strong>
                    <span th:text="${car.brand}"></span>
                </p>

                <p class="car-description"
                   th:text="${car.description}">
                    Car description
                </p>

                <div class="card-actions">

                    <a th:href="@{/admin/editCar(id=${car.id})}"
                       class="button button-secondary">
                        Edit
                    </a>

                    <a th:href="@{/admin/deleteCar(id=${car.id})}"
                       class="button button-danger"
                       onclick="return confirm('Are you sure you want to delete this car?')">
                        Delete
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
