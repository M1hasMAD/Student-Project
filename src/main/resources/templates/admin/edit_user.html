<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:insert="fragments/general.html :: admin-header"></div>

<main class="container section">
    <div class="page-header flex flex-between gap-md">
        <div>
            <h1 class="section-title">Edit User</h1>
            <p class="section-subtitle">Update the user's information.</p>
        </div>
        <a th:href="@{/admin/manageUsers}" class="btn btn-secondary">← Back to Users</a>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-header">
            <h2>User Information</h2>
            <p class="text-muted">Update the fields and save your changes.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/saveChangesOfUser}"
                  th:object="${userToEdit}"
                  method="post"
                  class="form-field">

                <input type="hidden" th:field="*{id}">

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           th:field="*{email}" required>
                </div>

                <div class="form-field">
                    <label for="pass">Password</label>
                    <input type="password" id="pass"
                           th:field="*{pass}"
                           placeholder="Enter password" required>
                </div>

                <div class="form-field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName"
                           th:field="*{firstName}" required>
                </div>

                <div class="form-field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName"
                           th:field="*{lastName}" required>
                </div>

                <div class="form-field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone"
                           th:field="*{phone}" required>
                </div>

                <div class="form-actions flex flex-between gap-md" style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--color-border);">
                    <a th:href="@{/admin/manageUsers}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
