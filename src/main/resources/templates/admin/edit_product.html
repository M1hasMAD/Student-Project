<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Car</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:insert="fragments/general.html :: admin-header"></div>

<main class="container section">
    <div class="page-header flex flex-between gap-md">
        <div>
            <h1 class="section-title">Edit Car</h1>
            <p class="section-subtitle">Modify the information of this car.</p>
        </div>
        <a th:href="@{/admin/manageCars}" class="btn btn-secondary">← Back to Cars</a>
    </div>

    <div class="card" style="max-width: 800px;">
        <div class="card-header">
            <h2>Car Details</h2>
            <p class="text-muted">Update the vehicle information below.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/saveChangesOfCar}"
                  th:object="${carToEdit}"
                  method="post"
                  enctype="multipart/form-data"
                  class="form-field">

                <div class="form-field">
                    <label for="title">Title</label>
                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           placeholder="Enter car title"
                           required>
                    <span class="error text-error" style="font-size: 12px; margin-top: 4px;"
                          th:if="${#fields.hasErrors('title')}"
                          th:errors="*{title}"></span>
                </div>

                <div class="form-field">
                    <label for="price">Price (€)</label>
                    <input id="price"
                           type="number"
                           step="0.01"
                           min="1"
                           max="99999"
                           th:field="*{price}"
                           placeholder="Enter price"
                           required>
                    <span class="error text-error" style="font-size: 12px; margin-top: 4px;"
                          th:if="${#fields.hasErrors('price')}"
                          th:errors="*{price}"></span>
                </div>

                <div class="form-field">
                    <label for="brand">Brand</label>
                    <input id="brand"
                           type="text"
                           th:field="*{brand}"
                           placeholder="Enter car brand"
                           required>
                </div>

                <div class="form-field">
                    <label for="categoryId">Category</label>
                    <select id="categoryId"
                            name="categoryId"
                            required>
                        <option value="">Select category</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${carToEdit.category != null and category.id == carToEdit.category.id}"></option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="description">Description</label>
                    <textarea id="description"
                              th:field="*{description}"
                              rows="5"
                              placeholder="Enter car description"></textarea>
                </div>

                <div class="form-field">
                    <label>Current Image</label>
                    <div class="current-image">
                        <img th:src="@{/get_image(id=${carToEdit.id})}"
                             alt="Current car image"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div style="display: none; color: var(--color-text-muted);">No image available</div>
                    </div>
                </div>

                <div class="form-field">
                    <label for="uploadedPhoto">Change Image</label>
                    <input id="uploadedPhoto"
                           type="file"
                           th:field="*{uploadedPhoto}"
                           accept="image/*">
                    <small>Leave empty if you want to keep the current image. (JPEG or PNG, max 20MB)</small>
                </div>

                <input type="hidden" th:field="*{id}">

                <div class="form-actions flex flex-between gap-md" style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--color-border);">
                    <a th:href="@{/admin/manageCars}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>

            </form>
        </div>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
