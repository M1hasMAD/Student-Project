<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Car</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div th:insert="fragments/general.html :: menu"></div>

<main class="admin-container">

    <div class="page-header">
        <div>
            <h1>Edit Car</h1>
            <p>Modify the information of this car.</p>
        </div>

        <a th:href="@{/admin/manageCars}" class="button button-secondary">
            ← Back to cars
        </a>
    </div>

    <div class="form-card">

        <form th:action="@{/admin/saveChangesOfCar}"
              th:object="${carToEdit}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">
                <label for="title">Title</label>

                <input id="title"
                       type="text"
                       th:field="*{title}"
                       placeholder="Enter car title">

                <span class="error"
                      th:if="${#fields.hasErrors('title')}"
                      th:errors="*{title}">
                </span>
            </div>

            <div class="form-group">
                <label for="price">Price (€)</label>

                <input id="price"
                       type="number"
                       step="0.01"
                       th:field="*{price}"
                       placeholder="Enter price">

                <span class="error"
                      th:if="${#fields.hasErrors('price')}"
                      th:errors="*{price}">
                </span>
            </div>

            <div class="form-group">
                <label for="brand">Brand</label>

                <input id="brand"
                       type="text"
                       th:field="*{brand}"
                       placeholder="Enter car brand">
            </div>

            <div class="form-group">
                <label for="categoryId">Category</label>

                <select id="categoryId"
                        name="categoryId"
                        required>

                    <option value="">Select category</option>

                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${carToEdit.category != null and category.id == carToEdit.category.id}">
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea id="description"
                          th:field="*{description}"
                          rows="5"
                          placeholder="Enter car description"></textarea>
            </div>

            <div class="form-group">
                <label>Current image</label>

                <div class="current-image">
                    <img th:src="@{/get_image(id=${carToEdit.id})}"
                         alt="Current car image">
                </div>
            </div>

            <div class="form-group">
                <label for="uploadedPhoto">Change image</label>

                <input id="uploadedPhoto"
                       type="file"
                       th:field="*{uploadedPhoto}"
                       accept="image/*">

                <small>
                    Leave empty if you want to keep the current image.
                </small>
            </div>

            <input type="hidden" th:field="*{id}">

            <div class="form-actions">
                <a th:href="@{/admin/manageCars}"
                   class="button button-secondary">
                    Cancel
                </a>

                <button type="submit"
                        class="button button-primary">
                    Save Changes
                </button>
            </div>

        </form>

    </div>

</main>

</body>
</html>
