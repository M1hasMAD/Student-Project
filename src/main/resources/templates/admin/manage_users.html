
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:insert="fragments/general.html :: menu"></div>

<main class="admin-container categories-page">

    <div class="page-header categories-header">
        <div>
            <span class="section-label">STORE MANAGEMENT</span>
            <h1>Manage Users</h1>
            <p>Create, edit and manage registered users.</p>
        </div>

        <div class="category-header-actions">
            <a th:href="@{/admin/registerUser}"
               class="button category-primary-button">
                + Add User
            </a>

            <a th:href="@{/admin/startAdmin}"
               class="button button-secondary">
                ← Dashboard
            </a>
        </div>
    </div>

    <div class="category-summary">
        <div class="category-summary-icon">♙</div>
        <div>
            <span class="category-summary-label">Total users</span>
            <strong th:text="${#lists.size(users)}">0</strong>
        </div>
    </div>

    <section class="category-table-card">
        <div class="category-table-heading">
            <h2>All Users</h2>
            <p>View and manage user information.</p>
        </div>

        <div class="category-table-wrapper">
            <table class="category-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <span class="category-id" th:text="${user.id}"></span>
                    </td>
                    <td>
                        <span class="category-name" th:text="${user.email}"></span>
                    </td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.phone}"></td>
                    <td>
                        <div class="category-row-actions">
                            <a th:href="@{/admin/editUser(id=${user.id})}"
                               class="button category-edit-button">
                                Edit
                            </a>

                            <a th:href="@{/admin/deleteUser(id=${user.id})}"
                               class="button category-delete-button"
                               onclick="return confirm('Are you sure you want to delete this user?')">
                                Delete
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="category-empty-state" th:if="${#lists.isEmpty(users)}">
            <h3>No users yet</h3>
            <p>Create your first user to get started.</p>
            <a th:href="@{/admin/registerUser}"
               class="button category-primary-button">
                + Create User
            </a>
        </div>
    </section>

</main>

</body>
</html>
