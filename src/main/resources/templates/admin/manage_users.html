<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:insert="fragments/general.html :: admin-header"></div>

<main class="container section">
    <div class="page-header flex flex-between gap-md">
        <div>
            <h1 class="section-title">Manage Users</h1>
            <p class="section-subtitle">Create, edit and manage registered users.</p>
        </div>
        <a th:href="@{/admin/registerUser}" class="btn btn-primary">+ Add User</a>
    </div>

    <div class="card" style="margin-bottom: 24px;">
        <div class="card-body flex flex-between gap-md">
            <div>
                <span class="badge badge-primary">Total Users</span>
                <strong style="font-size: 28px; margin-left: 12px;" th:text="${#lists.size(users)}">0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>All Users</h2>
            <p class="text-muted">View and manage user information.</p>
        </div>
        <div class="card-body" style="padding: 0;">
            <div class="table-wrapper">
                <table class="category-table">
                    <thead>
                    <tr>
                        <th class="category-id-column">ID</th>
                        <th>Email</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Phone</th>
                        <th class="category-actions-column">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <span class="category-id" th:text="${user.id}"></span>
                        </td>
                        <td>
                            <span class="category-name" th:text="${user.email}"></span>
                        </td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.phone}"></td>
                        <td>
                            <div class="category-row-actions">
                                <a th:href="@{/admin/editUser(id=${user.id})}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</a>
                                <a th:href="@{/admin/deleteUser(id=${user.id})}" class="btn btn-ghost" style="padding: 6px 12px; font-size: 12px; color: var(--color-error);" onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-body text-center" th:if="${#lists.isEmpty(users)}" style="padding: 48px 24px;">
            <h3 style="margin: 0 0 8px;">No users yet</h3>
            <p class="text-muted" style="margin: 0 0 24px;">Create your first user to get started.</p>
            <a th:href="@{/admin/registerUser}" class="btn btn-primary">+ Create User</a>
        </div>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
