<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.manage_users.title} + ' | ' + #{app.name}">Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:insert="fragments/general.html :: admin-header"></div>

<main class="container section">
    <div class="page-header flex flex-between gap-md">
        <div>
            <h1 class="section-title" th:text="#{admin.manage_users.title}">Manage Users</h1>
            <p class="section-subtitle" th:text="#{admin.manage_users.subtitle}">Create, edit and manage registered users.</p>
        </div>
        <a th:href="@{/admin/registerUser}" class="btn btn-primary" th:text="#{admin.manage_users.add_user}">+ Add User</a>
    </div>

    <div class="card" style="margin-bottom: 24px;">
        <div class="card-body flex flex-between gap-md">
            <div>
                <span class="badge badge-primary" th:text="#{admin.manage_users.total_users}">Total Users</span>
                <strong style="font-size: 28px; margin-left: 12px;" th:text="${#lists.size(users)}">0</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 th:text="#{admin.manage_users.all_users}">All Users</h2>
            <p class="text-muted" th:text="#{admin.manage_users.manage_info}">View and manage user information.</p>
        </div>
        <div class="card-body" style="padding: 0;">
            <div class="table-wrapper">
                <table class="category-table">
                    <thead>
                    <tr>
                        <th class="category-id-column" th:text="#{admin.common.id}">ID</th>
                        <th th:text="#{admin.manage_users.email}">Email</th>
                        <th th:text="#{admin.manage_users.first_name}">First Name</th>
                        <th th:text="#{admin.manage_users.last_name}">Last Name</th>
                        <th th:text="#{admin.manage_users.phone}">Phone</th>
                        <th class="category-actions-column" th:text="#{admin.common.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <span class="category-id" th:text="${user.id}"></span>
                        </td>
                        <td>
                            <span class="category-name" th:text="${user.email}"></span>
                        </td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.phone}"></td>
                        <td>
                            <div class="category-row-actions">
                                <a th:href="@{/admin/editUser(id=${user.id})}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" th:text="#{admin.common.edit}">Edit</a>
                                <a th:href="@{/admin/deleteUser(id=${user.id})}" class="btn btn-ghost" style="padding: 6px 12px; font-size: 12px; color: var(--color-error);" onclick="return confirm('#{admin.common.confirm_delete}')" th:text="#{admin.common.delete}">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-body text-center" th:if="${#lists.isEmpty(users)}" style="padding: 48px 24px;">
            <h3 style="margin: 0 0 8px;" th:text="#{admin.manage_users.no_users}">No users yet</h3>
            <p class="text-muted" style="margin: 0 0 24px;" th:text="#{admin.manage_users.create_first}">Create your first user to get started.</p>
            <a th:href="@{/admin/registerUser}" class="btn btn-primary" th:text="#{admin.manage_users.create_user}">+ Create User</a>
        </div>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p th:text="#{footer.copyright}">&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<div th:insert="fragments/general.html :: language-script"></div>

</body>
</html>
