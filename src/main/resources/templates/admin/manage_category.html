<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.register_category.title} + ' | ' + #{app.name}">Create Category</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:insert="fragments/general.html :: admin-header"></div>

<main class="container section">
    <div class="page-header flex flex-between gap-md">
        <div>
            <h1 class="section-title" th:text="#{admin.register_category.title}">Create Category</h1>
            <p class="section-subtitle" th:text="#{admin.register_category.subtitle}">Add a new category to organize your cars.</p>
        </div>
        <a th:href="@{/admin/manageCategories}" class="btn btn-secondary" th:text="#{admin.register_category.cancel}">← Back to Categories</a>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-header">
            <h2 th:text="#{admin.register_category.name_label}">Category Information</h2>
            <p class="text-muted" th:text="#{admin.register_category.subtitle}">Enter the details for your new category.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/saveCategory}"
                  th:object="${newCategory}"
                  method="post"
                  class="form-field">

                <div class="form-field">
                    <label for="name" th:text="#{admin.register_category.name_label}">Category Name</label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           placeholder="e.g. Electric"
                           required>
                    <small>Choose a short, descriptive name.</small>
                </div>

                <div class="form-field">
                    <label for="description" th:text="#{admin.register_category.description_label}">Description</label>
                    <textarea id="description"
                              th:field="*{description}"
                              rows="5"
                              placeholder="Describe the cars in this category..."
                              required></textarea>
                    <small>Explain what type of cars belong to this category.</small>
                </div>

                <div class="form-actions flex flex-between gap-md" style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--color-border);">
                    <a th:href="@{/admin/manageCategories}" class="btn btn-secondary" th:text="#{admin.register_category.cancel}">Cancel</a>
                    <button type="submit" class="btn btn-primary" th:text="#{admin.register_category.save}">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p th:text="#{footer.copyright}">&copy; 2025 Car Store. All rights reserved.</p>
    </div>
</footer>

<div th:insert="fragments/general.html :: language-script"></div>

</body>
</html>
