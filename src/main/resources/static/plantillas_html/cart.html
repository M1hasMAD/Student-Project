<div class="cart-container">
    <div class="cart-header">
        <h1 data-i18n="cart.title">Shopping Cart</h1>
    </div>

    {{#empty}}
    <div class="card text-center" style="padding: 60px 20px;">
        <p style="font-size: 20px; color: var(--color-text-muted); margin: 0 0 24px;" data-i18n="cart.empty">Your shopping cart is empty.</p>
        <a href="#" onclick="showCars(); return false;" class="btn btn-primary" data-i18n="cart.continue_shopping">← Continue Shopping</a>
    </div>
    {{/empty}}

    {{^empty}}
    {{#products}}
    <div class="cart-item" data-car-id="{{id}}">
        <img src="{{imageUrl}}" alt="{{title}}" class="cart-item-image">

        <div class="cart-item-details">
            <h3 class="cart-item-title">{{title}}</h3>
            <p class="cart-item-price"><span data-i18n="cart.price">Price:</span> €{{price}}</p>
            <p class="cart-item-subtotal"><span data-i18n="cart.subtotal">Subtotal:</span> <span class="subtotal-value">€{{subtotal}}</span></p>
        </div>

        <div class="cart-item-actions">
            <label for="cartQuantity-{{id}}" class="visually-hidden" data-i18n="cart.quantity">Quantity:</label>
            <div class="quantity-control">
                <button type="button" class="btn btn-secondary qty-btn" data-action="decrease" data-car-id="{{id}}" aria-label="Decrease quantity">−</button>
                <input id="cartQuantity-{{id}}" type="number" class="qty-input"
                       min="1" value="{{quantity}}"
                       data-car-id="{{id}}"
                       style="width: 70px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 14px; text-align: center;">
                <button type="button" class="btn btn-secondary qty-btn" data-action="increase" data-car-id="{{id}}" aria-label="Increase quantity">+</button>
            </div>

            <button type="button"
                    class="btn btn-ghost"
                    onclick="removeFromCart({{id}})"
                    style="padding: 8px 16px; color: var(--color-error);"
                    data-i18n="cart.remove">
                Remove
            </button>
        </div>
    </div>
    {{/products}}

    <div class="cart-summary">
        <div class="cart-summary-totals">
            <span class="cart-summary-label"><span data-i18n="cart.total_quantity">Total quantity:</span> <strong id="totalQuantity">{{totalQuantity}}</strong></span>
            <span class="cart-summary-total"><span data-i18n="cart.total">Total:</span> <span id="cartTotal">€{{total}}</span></span>
        </div>
        <div class="cart-actions">
            <button type="button"
                    onclick="showCars()"
                    class="btn btn-secondary"
                    style="padding: 12px 24px;"
                    data-i18n="cart.continue_shopping">
                Continue Shopping
            </button>
            <button type="button"
                    onclick="window.location.href='/checkout/step1'"
                    class="btn btn-primary"
                    style="padding: 12px 24px;"
                    data-i18n="cart.proceed_checkout">
                Proceed to Checkout
            </button>
        </div>
    </div>

    <p id="cartMessage" role="status" class="text-center text-muted" style="margin-top: 16px;"></p>
    {{/empty}}
</div>
