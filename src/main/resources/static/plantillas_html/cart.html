<div class="cart-container">
    <div class="cart-header">
        <h1>Shopping Cart</h1>
    </div>

    {{#empty}}
    <div class="card text-center" style="padding: 60px 20px;">
        <p style="font-size: 20px; color: var(--color-text-muted); margin: 0 0 24px;">Your shopping cart is empty.</p>
        <a href="#" onclick="showCars(); return false;" class="btn btn-primary">← Continue Shopping</a>
    </div>
    {{/empty}}

    {{^empty}}
    {{#products}}
    <div class="cart-item">
        <img src="{{imageUrl}}" alt="{{title}}" class="cart-item-image">

        <div class="cart-item-details">
            <h3 class="cart-item-title">{{title}}</h3>
            <p class="cart-item-price">Price: €{{price}}</p>
            <p class="cart-item-subtotal">Subtotal: €{{subtotal}}</p>
        </div>

        <div class="cart-item-actions">
            <label for="cartQuantity-{{id}}">Quantity:</label>
            <input id="cartQuantity-{{id}}" type="number"
                   min="1" value="{{quantity}}"
                   style="width: 70px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 14px; text-align: center;">

            <button type="button"
                    class="btn btn-secondary"
                    onclick="updateCartQuantity({{id}})"
                    style="padding: 8px 16px;">
                Update
            </button>

            <button type="button"
                    class="btn btn-ghost"
                    onclick="removeFromCart({{id}})"
                    style="padding: 8px 16px; color: var(--color-error);">
                Remove
            </button>
        </div>
    </div>
    {{/products}}

    <div class="cart-summary">
        <div class="cart-summary-totals">
            <span class="cart-summary-label">Total quantity: <strong>{{totalQuantity}}</strong></span>
            <span class="cart-summary-total">Total: €{{total}}</span>
        </div>
        <div class="cart-actions">
            <button type="button"
                    onclick="showCars()"
                    class="btn btn-secondary"
                    style="padding: 12px 24px;">
                Continue Shopping
            </button>
            <button type="button"
                    onclick="window.location.href='/checkout/step1'"
                    class="btn btn-primary"
                    style="padding: 12px 24px;">
                Proceed to Checkout
            </button>
        </div>
    </div>

    <p id="cartMessage" role="status" class="text-center text-muted" style="margin-top: 16px;"></p>
    {{/empty}}
</div>
