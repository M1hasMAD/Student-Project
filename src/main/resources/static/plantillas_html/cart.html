
<div style="background:white;padding:30px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,0.07)">
    <h1>Shopping Cart</h1>

    {{#empty}}
    <p>Your shopping cart is empty.</p>
    {{/empty}}

    {{#products}}
    <div style="display:flex;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid #e5e7eb;flex-wrap:wrap">
        <img src="{{imageUrl}}" alt="{{title}}"
             style="width:120px;height:80px;object-fit:cover;border-radius:8px">

        <div style="flex:1;min-width:160px">
            <h3>{{title}}</h3>
            <p>Price: €{{price}}</p>
            <p>Subtotal: €{{subtotal}}</p>
        </div>

        <div>
            <label for="cartQuantity-{{id}}">Quantity:</label>
            <input id="cartQuantity-{{id}}" type="number"
                   min="1" value="{{quantity}}"
                   style="width:70px;padding:8px">

            <button type="button"
                    onclick="updateCartQuantity({{id}})"
                    style="padding:8px;margin:4px">
                Update
            </button>

            <button type="button"
                    onclick="removeFromCart({{id}})"
                    style="padding:8px;margin:4px">
                Remove
            </button>
        </div>
    </div>
    {{/products}}

    <h2>Total quantity: {{totalQuantity}}</h2>
    <h2>Total: €{{total}}</h2>

    <button type="button" onclick="showCars()" style="padding:10px 18px">
        Continue shopping
    </button>

    <p id="cartMessage" role="status"></p>
</div>
