<div class="car-details-container">

    <div class="car-details-gallery">
        <div style="position: relative; max-width: 800px; margin: 0 auto;">
            <img id="mainCarImage"
                 src="{{mainImageUrl}}"
                 alt="{{title}}"
                 class="car-details-main-image">

            {{#images.length}}
            <button type="button"
                    id="previousCarImage"
                    class="btn btn-ghost"
                    style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 10; width: 44px; height: 44px; padding: 0; border-radius: 50%; background: rgba(26, 42, 58, 0.7); color: white;"
                    aria-label="Previous image">❮</button>

            <button type="button"
                    id="nextCarImage"
                    class="btn btn-ghost"
                    style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); z-index: 10; width: 44px; height: 44px; padding: 0; border-radius: 50%; background: rgba(26, 42, 58, 0.7); color: white;"
                    aria-label="Next image">❯</button>
            {{/images.length}}
        </div>

        {{#images.length}}
        <div id="carImageThumbnails" class="car-details-thumbnails" style="margin-top: 16px; display: flex; gap: 12px; justify-content: center; overflow-x: auto; padding-bottom: 8px;">
            <img src="{{mainImageUrl}}" alt="{{title}} - Main" class="car-details-thumb active" data-index="0" style="width: 100px; height: 75px; object-fit: cover; border-radius: var(--radius-md); border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color var(--transition-fast);">
            {{#images}}
            <img src="{{url}}" alt="{{title}} - Image {{@index}}" class="car-details-thumb" data-index="{{@index+1}}" style="width: 100px; height: 75px; object-fit: cover; border-radius: var(--radius-md); border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color var(--transition-fast);">
            {{/images}}
        </div>

        <div id="carImageCounter" style="text-align: center; margin-top: 12px; color: var(--color-text-muted); font-size: 13px;"></div>
        {{/images.length}}
    </div>

    <script>
        (function () {
            const images = [
                "{{mainImageUrl}}"
                {{#images}},
                "{{url}}"
                {{/images}}
            ];

            let currentIndex = 0;

            const mainImage = document.getElementById("mainCarImage");
            const counter = document.getElementById("carImageCounter");
            const previous = document.getElementById("previousCarImage");
            const next = document.getElementById("nextCarImage");
            const thumbnails = document.querySelectorAll(".car-details-thumb");

            function renderImage() {
                mainImage.src = images[currentIndex];
                if (counter) {
                    counter.textContent = (currentIndex + 1) + " / " + images.length;
                }

                previous.disabled = images.length <= 1;
                next.disabled = images.length <= 1;

                thumbnails.forEach((thumb, idx) => {
                    thumb.classList.toggle('active', idx === currentIndex);
                });
            }

            if (previous) {
                previous.addEventListener("click", function () {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    renderImage();
                });
            }

            if (next) {
                next.addEventListener("click", function () {
                    currentIndex = (currentIndex + 1) % images.length;
                    renderImage();
                });
            }

            thumbnails.forEach((thumb, idx) => {
                thumb.addEventListener("click", function() {
                    currentIndex = idx;
                    renderImage();
                });
            });

            renderImage();
        })();
    </script>

    <div class="car-details-header">
        <h1 class="car-details-title">{{title}}</h1>
        <p class="car-details-price">€{{price}}</p>

        <div class="car-details-meta">
            <p><strong>Brand:</strong> {{brand}}</p>
            <p><strong>Category:</strong> {{category}}</p>
        </div>
    </div>

    <div class="car-details-description">
        {{description}}
    </div>

    <div class="car-details-actions">
        <div class="quantity-control" style="flex: 1; max-width: 200px;">
            <label for="detailQuantity">Quantity:</label>
            <input id="detailQuantity"
                   type="number"
                   value="1"
                   min="1"
                   style="width: 80px; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 15px; text-align: center;">
        </div>

        <button type="button"
                class="btn btn-primary"
                onclick="addToCart({{id}}, document.getElementById('detailQuantity').value)"
                style="padding: 12px 24px; font-size: 15px;">
            <span>＋</span> Add to Cart
        </button>

        <a href="#" onclick="showCars(); return false;" class="btn btn-secondary" style="padding: 12px 24px; font-size: 15px;">
            ← Back to listings
        </a>
    </div>

</div>
