{{#.}}

<div class="car-card">
    <img class="car-card-image"
         src="/images/get_thumbnail?id={{id}}"
         alt="{{title}}">

    <div class="car-card-content">
        <h2 class="car-card-title">{{title}}</h2>

        <p class="car-card-price">€{{price}}</p>

        <div class="car-card-info">
            <p><strong data-i18n="car.brand">Brand:</strong> {{brand}}</p>
            <p><strong data-i18n="car.category">Category:</strong> {{category}}</p>
        </div>

        <a href="#" onclick="showDetails({{id}}); return false;"
           class="car-details-link" data-i18n="car.view_details">
            View details
        </a>

        <div class="car-card-actions">
            <div class="quantity-control">
                <label for="listQuantity-{{id}}" data-i18n="car.quantity">Quantity</label>
                <input id="listQuantity-{{id}}"
                       type="number"
                       value="1"
                       min="1">
            </div>

            <button type="button"
                    class="add-cart-button"
                    onclick="addToCart({{id}}, document.getElementById('listQuantity-{{id}}').value)"
                    data-i18n="car.add_to_cart">
                <span>＋</span> Add to Cart
            </button>
        </div>
    </div>
</div>

{{/.}}
